services:
  emede:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emede
    ports:
      - "5178:5178"
    environment:
      - HOST=0.0.0.0
      - PORT=5178
      - EMEDE_DATA_DIR=/data/.emede
    volumes:
      # Persist user data (projects, settings, API keys)
      - emede-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5178/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  emede-data:
